spring.main.web-application-type=none
spring.main.banner-mode=off

# Embedded, file-based H2. Nothing listens on a network port. app.data-dir is set by MainApp (see AppPaths).
spring.datasource.url=jdbc:h2:file:${app.data-dir}/smartwarranty
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.org.example=INFO

# Installed builds have no console, so also keep a log file next to the data.
logging.file.name=${app.data-dir}/logs/app.log
